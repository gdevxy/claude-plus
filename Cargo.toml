[package]
name = "claude-plus"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Token, cache and cost visibility for Claude Code"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server-graceful", "tokio"] }
indicatif = "0.18.6"
libc = "0.2.190"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
